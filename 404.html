<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages SPA: 모든 경로를 앱으로 리다이렉트
    var pathSegments = location.pathname.split('/').filter(Boolean);
    var repoName = pathSegments[0] || 'easy-webaapp';
    location.replace(location.origin + '/' + repoName + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
